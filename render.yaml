databases:
  - name: jonkstore-db
    databaseName: jonkstore
    user: jonkadmin
    plan: free
  - name: jonkai-db
    databaseName: jonkai
    user: jonkadmin
    plan: free

services:
  # 1. Node.js Operational API (backend)
  - type: web
    name: jonkstore-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: API_PREFIX
        value: /api
      - key: LOG_PRETTY
        value: "false"
      - key: LOG_LEVEL
        value: info
      
      # Database Connections
      - key: DB_STORE_URL
        fromDatabase:
          name: jonkstore-db
          property: connectionString
      - key: DB_AI_URL
        fromDatabase:
          name: jonkai-db
          property: connectionString
      
      # Internal AI Engine Link
      - key: JONKAI_ENGINE_URL
        value: http://jonkai-engine:10000
      
      # Firebase Admin SDK (Set in Render Dashboard)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      
      # SMTP Configuration (Set in Render Dashboard)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        value: JonkStore
      - key: SMTP_FROM_EMAIL
        sync: false

      # App Settings
      - key: OWNER_EMAIL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: CORS_ORIGIN
        value: "*"

  # 2. Python Intelligence Engine (ai)
  - type: web
    name: jonkai-engine
    runtime: docker
    rootDir: ai
    autoDeployTrigger: commit
    envVars:
      - key: JONKAI_DATABASE_URL
        fromDatabase:
          name: jonkai-db
          property: connectionString
      - key: LOG_LEVEL
        value: INFO
      - key: ENV
        value: production
      
      # OpenAI (Set in Render Dashboard)
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: FEATURE_WINDOW_DAYS
        value: "30"
