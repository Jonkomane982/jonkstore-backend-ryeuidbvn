[tool.poetry]
name = "jonkai-engine"
version = "1.0.0"
description = "Python AI Engine for JonkStore"
authors = ["JonkStore Team"]

[tool.poetry.dependencies]
python = "^3.10"
sqlalchemy = "^2.0.0"
psycopg = {extras = ["binary"], version = "^3.1.0"}
pandas = "^2.0.0"
numpy = "^1.24.0"
scikit-learn = "^1.3.0"
statsmodels = "^0.14.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
python-dotenv = "^1.0.0"
structlog = "^23.1.0"
fastapi = "^0.100.0"
uvicorn = "^0.23.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
