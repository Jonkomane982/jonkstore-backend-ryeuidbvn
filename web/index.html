<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="jonkstore">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>jonkstore</title>
  <link rel="manifest" href="manifest.json">

  <!--
    NOTE: NO `window.flutterConfiguration` or `window.flutterWebRenderer`
    globals are defined here.
    Both are deprecated in Flutter 3.22+ and cause assertion failures when
    combined with the new `engineInitializer.initializeEngine(config)` flow
    that the generated flutter_bootstrap.js uses internally.

    Renderer selection is handled at build/run time via
    `--dart-define=FLUTTER_WEB_RENDERER=html` (see flutter run invocation)
    and/or by the fallback engine preference inside web_entrypoint.dart.

    Fonts are also configured not to depend on CDNs:
      * lib/app/theme/app_text_styles.dart uses a cross-platform system
        font stack (Inter, Segoe UI, Roboto, system-ui, sans-serif) instead
        of `GoogleFonts.inter()` which would hit fonts.gstatic.com.
  -->
</head>
<body>
  <!--
    This script is generated by `flutter build web` / `flutter run -d chrome`
    at build time. It handles downloading the correct engine scripts
    (HTML or CanvasKit, depending on runtime config) and boots Dart.
    See: https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
